<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CÓBANO Cloud v2.2.0</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1b7a3a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="team.js"></script><script src="bio.js"></script>
<style>
:root{--bg:#f4f8f5;--c:#fff;--tx:#14301d;--mu:#5d7466;--g:#1b7a3a;--b:#0a7bb5;--ln:#d5e3d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a12;--c:#16261c;--tx:#e6f1ea;--mu:#93aa9b;--g:#3fae63;--b:#4db3e6;--ln:#274232}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--c);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
header b{flex:1;font-size:16px}header img{height:30px}
main{padding:12px 12px 80px;max-width:760px;margin:auto}
.card{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:8px 12px;margin:2px}
button.s{background:transparent;color:var(--g);border:1px solid var(--g)}button.r{background:#b3372c}
input,select{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 120px}
.chip{background:var(--c);color:var(--tx);border:1px solid var(--ln);min-width:44px}.chip.on{background:var(--g);color:#fff}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--ln);padding:3px;white-space:nowrap;font-size:13px}
td input{min-width:90px;padding:5px}td.ro{color:var(--mu);text-align:right}th{text-align:left;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;margin:0;padding:12px 4px}nav button.on{color:var(--g);font-weight:700}
small,.mu{color:var(--mu)}h3{margin:4px 0 8px}
#sp{position:fixed;inset:0;background:#fff;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,transform .8s}
#sp img{width:min(78vw,340px);opacity:0;transform:scale(.82);filter:blur(14px);transition:all 1.4s cubic-bezier(.2,.8,.2,1)}
#sp h1{margin:18px 0 0;font:600 26px system-ui;color:#14301d;opacity:0;transform:translateY(12px);transition:all 1s .7s}
#sp.go img{opacity:1;transform:none;filter:none}#sp.go h1{opacity:1;transform:none}#sp.out{opacity:0;transform:scale(1.08);pointer-events:none}
#t{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#14301d;color:#fff;padding:9px 14px;border-radius:20px;opacity:0;transition:opacity .3s;z-index:50;max-width:90%}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.ph img{width:100%;border-radius:8px}
</style></head><body>

<script>
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS='cobano_v1',toast=m=>{const t=$('#t');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,3000)};
const SP="Swietenia macrophylla|Caoba;Cedrela odorata|Cedro rojo;Handroanthus impetiginosus|Amapa;Tabebuia rosea|Macuil;Enterolobium cyclocarpum|Parota;Guazuma ulmifolia|Guácimo;Bursera simaruba|Palo mulato;Lysiloma divaricatum|Mauto;Ceiba pentandra|Ceiba;Ceiba aesculifolia|Pochote;Cordia alliodora|Laurel;Pinus oocarpa|Pino ocote;Quercus oleoides|Encino;Gliricidia sepium|Cacahuananche;Spondias mombin|Jobo;Brosimum alicastrum|Ramón;Haematoxylum brasiletto|Brasil;Ipomoea arborescens|Palo blanco;Prosopis juliflora|Mezquite;Vachellia farnesiana|Huizache;Tectona grandis|Teca;Gmelina arborea|Melina;Eucalyptus camaldulensis|Eucalipto;Leucaena leucocephala|Guaje;Pithecellobium dulce|Guamúchil;Cochlospermum vitifolium|Rosa amarilla;Lonchocarpus lanceolatus|Palo de arco;Cordia elaeagnoides|Barcino".split(';').map(x=>x.split('|'));
let D={p:[],sp:SP},P=null,tab='sit',si=0,DL=null;
try{D=Object.assign(D,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){toast('Memoria llena: exporta un respaldo')}window.onSave&&onSave()};
try{claude.use('downloads').then(d=>DL=d)}catch(e){}
const BC=()=>[{id:'sci',n:'Nombre científico',t:'sci'},{id:'com',n:'Nombre común',t:'com'},{id:'d',n:'DAP (cm)',t:'num'},{id:'h',n:'Altura (m)',t:'num'},{id:'ab',n:'AB (m²)',t:'calc',f:'Math.PI*d*d/40000'},{id:'vol',n:'Vol (m³)',t:'calc',f:'ab*h*0.6'}];
function utm(lat,lon,z){z=z||Math.floor((lon+180)/6)+1;const a=6378137,e2=.00669438,k=.9996,r=Math.PI/180,l0=((z-1)*6-177)*r,p=lat*r,l=lon*r,s=Math.sin(p),N=a/Math.sqrt(1-e2*s*s),T=Math.tan(p)**2,ep=e2/(1-e2),C=ep*Math.cos(p)**2,A=Math.cos(p)*(l-l0),e4=e2*e2,e6=e4*e2;
const M=a*((1-e2/4-3*e4/64-5*e6/256)*p-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*p)+(15*e4/256+45*e6/1024)*Math.sin(4*p)-35*e6/3072*Math.sin(6*p));
const x=k*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep)*A**5/120)+5e5;let y=k*(M+N*Math.tan(p)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep)*A**6/720));if(lat<0)y+=1e7;return{x,y,z}}
const U=s=>{if(s.lat==null)return'sin coordenadas';const u=utm(s.lat,s.lon,P.zone);return`Z${u.z}${s.lat<0?'S':'N'}  X ${u.x.toFixed(0)}  Y ${u.y.toFixed(0)}`};
const calc=(c,t)=>{try{const d=+t.d||0,ab=Math.PI*d*d/40000;const v=new Function('d','h','ab','return '+c.f)(d,+t.h||0,ab);return isFinite(v)?v:''}catch(e){return''}};
const fm=v=>v===''?'':(+v).toFixed(4).replace(/\.?0+$/,'');
function R(){const a=$('#app');$('#bk').style.display=P?'':'none';$('#nv').style.display=P?'flex':'none';$('#ti').textContent=P?P.name:'CÓBANO Cloud';
$('#dsci').innerHTML=D.sp.map(s=>`<option value="${esc(s[0])}">${esc(s[1])}</option>`).join('');$('#dcom').innerHTML=D.sp.filter(s=>s[1]).map(s=>`<option value="${esc(s[1])}">${esc(s[0])}</option>`).join('');
if(!P)return home(a);if(P.area=='bio')return bioR(a);
$('#nv').innerHTML=[['sit','🌳 Sitios'],['map','🗺 Mapa'],['res','📊 Resultados'],['team','👥 Equipo'],['cfg','⚙ Config']].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="tab='${x[0]}';R()">${x[1]}</button>`).join('');
a.innerHTML={sit:sitT,map:mapT,res:resT,team:teamT,cfg:cfgT}[tab]()}
function home(a){a.innerHTML=`<div class="row"><button class="${AREA=='for'?'':'s'}" onclick="AREA='for';R()">🌳 Forestal</button><button class="${AREA=='bio'?'':'s'}" onclick="AREA='bio';R()">🦎 Biología</button></div><br><div class="card"><h3>Nuevo proyecto · ${AREA=='bio'?'Biología':'Forestal'}</h3><input id="pn" placeholder="Nombre del proyecto"><br><br><select id="pm" style="display:${AREA=='bio'?'none':''}"><option value="manual">1. Sin archivos (sitios manuales con GPS)</option><option value="puntos">2. Capa de puntos con número de sitio</option><option value="sinnum">3. Capa de puntos sin número de sitio</option><option value="poli">4. Polígono (genera los sitios)</option></select><br><br><button onclick="newP()">Crear proyecto</button></div>
${D.p.map((p,i)=>(p.area||'for')!=AREA?'':`<div class="card row"><div><b>${esc(p.name)}</b><br><small>${p.area=='bio'?p.obs.length+' registros':p.sites.length+' sitios · '+p.sites.reduce((n,s)=>n+s.trees.length,0)+' árboles'}</small></div><div style="flex:0 0 auto"><button onclick="P=D.p[${i}];tab='sit';bt='obs';si=0;R()">Abrir</button></div></div>`).join('')}
<div class="card"><h3>Respaldo</h3><small>Los datos se guardan en este dispositivo. Exporta un respaldo para guardarlo en tu nube (Drive, etc.).</small><br><button class="s" onclick="dl('cobano-respaldo.json',new Blob([JSON.stringify(D)]))">Exportar respaldo</button><label class="s" style="display:inline-block;border:1px solid var(--g);color:var(--g);border-radius:10px;padding:8px 12px">Importar<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label></div>`}
async function imp(f){try{const j=JSON.parse(await f.text());D.p=D.p.concat(j.p||[]);j.sp?.forEach(s=>{if(!D.sp.some(x=>x[0]==s[0]))D.sp.push(s)});save();R();toast('Respaldo importado')}catch(e){toast('Archivo no válido')}}
function newP(){const n=$('#pn').value.trim();if(!n)return toast('Escribe un nombre');P={area:AREA,obs:[],id:Date.now(),name:n,mode:AREA=='bio'?'manual':$('#pm').value,zone:null,sites:[],poly:[],cols:BC(),plot:0.1};D.p.push(P);tab=P.mode=='manual'?'sit':'cfg';si=0;save();R()}
function sitT(){const s=P.sites[si];let h=`<div class="card"><div class="sc">${P.sites.map((x,i)=>`<button class="chip ${i==si?'on':''}" onclick="si=${i};R()">${x.n}</button>`).join('')}${P.mode=='manual'?'<button onclick="addS()">+ Sitio</button>':''}</div>${!P.sites.length?'<small>'+(P.mode=='manual'?'Agrega un sitio.':'Ve a Config para cargar el archivo.')+'</small>':''}</div>`;
if(!s)return h;
h+=`<div class="card"><div class="row"><h3 style="flex:0 0 auto">Sitio</h3><input type="number" style="flex:0 0 90px" value="${s.n}" onchange="P.sites[si].n=+this.value;save();R()"><button class="s" onclick="gps()">📍 Usar GPS</button><button class="r" onclick="if(confirm('¿Borrar sitio?')){P.sites.splice(si,1);si=0;save();R()}">🗑</button></div><small>${U(s)}</small></div>
<div class="card"><div class="sc"><table><tr>${P.cols.map(c=>`<th>${esc(c.n)}</th>`).join('')}<th></th></tr>${s.trees.map((t,i)=>`<tr>${P.cols.map(c=>c.t=='calc'?`<td class="ro">${fm(calc(c,t))}</td>`:`<td><input data-i="${i}" data-c="${c.id}" ${c.t=='sci'?'list="dsci"':c.t=='com'?'list="dcom"':''} ${c.t=='num'?'type="number" inputmode="decimal"':''} value="${esc(t[c.id])}"></td>`).join('')}<td><button class="s" onclick="cp(${i})">⧉</button><button class="r" onclick="s_del(${i})">✕</button></td></tr>`).join('')}</table></div>
<button onclick="cp(-1)">+ Árbol</button>${s.trees.length?`<button class="s" onclick="cp(${s.trees.length-1})">⧉ Misma especie que el anterior</button>`:''}</div>
<div class="card"><h3>Fotos del sitio</h3><button onclick="$('#pf').click()">📷 Tomar foto</button><div class="ph">${s.photos.map((p,i)=>`<div><img src="${p.im}"><small>${p.lat?U({lat:p.lat,lon:p.lon}):''}</small><br><button class="r" onclick="P.sites[si].photos.splice(${i},1);save();R()">✕</button></div>`).join('')}</div><small>Si no reconoces una especie, toma la foto y se guarda con sus coordenadas.</small></div>`;return h}
function addS(){P.sites.push({n:Math.max(0,...P.sites.map(s=>s.n))+1,lat:null,lon:null,trees:[],photos:[]});si=P.sites.length-1;save();R()}
const pos=()=>new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>r(p.coords),()=>r(null),{enableHighAccuracy:true,timeout:9000}):r(null));

$('#pf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!P.sites[si])return;const c=await pos(),s=P.sites[si],lat=c?c.latitude:s.lat,lon=c?c.longitude:s.lon;

function mapT(){const ss=P.sites.filter(s=>s.lat!=null),ph=P.sites.flatMap(s=>s.photos.filter(p=>p.lat!=null).map(p=>({...p,n:s.n}))),pts=[...P.poly,...ss.map(s=>[s.lat,s.lon]),...ph.map(p=>[p.lat,p.lon])];if(!pts.length)return'<div class="card">Sin coordenadas para mostrar.</div>';
const la=pts.reduce((a,p)=>a+p[0],0)/pts.length,lo=pts.reduce((a,p)=>a+p[1],0)/pts.length,kx=111320*Math.cos(la*Math.PI/180),ky=110574,q=p=>[(p[1]-lo)*kx,-(p[0]-la)*ky],xs=pts.map(q),mx=Math.min(...xs.map(a=>a[0])),my=Math.min(...xs.map(a=>a[1])),w=Math.max(...xs.map(a=>a[0]))-mx,hh=Math.max(...xs.map(a=>a[1]))-my,sc=300/Math.max(w,hh,1),f=p=>{const a=q(p);return[(a[0]-mx)*sc+20,(a[1]-my)*sc+20]};
return`<div class="card"><svg viewBox="0 0 340 ${hh*sc+40}" width="100%" style="background:var(--bg);border-radius:10px">${P.poly.length?`<polygon points="${P.poly.map(p=>f(p).join(',')).join(' ')}" fill="#1b7a3a33" stroke="#1b7a3a" stroke-width="2"/>`:''}${ss.map(s=>{const a=f([s.lat,s.lon]);return`<circle cx="${a[0]}" cy="${a[1]}" r="5" fill="#0a7bb5" onclick="si=${P.sites.indexOf(s)};tab='sit';R()"/><text x="${a[0]+7}" y="${a[1]+4}" font-size="11" fill="currentColor">${s.n}</text>`}).join('')}${ph.map(p=>{const a=f([p.lat,p.lon]);return`<text x="${a[0]}" y="${a[1]}" font-size="14">📷</text>`}).join('')}</svg><small>Vista esquemática (sin mapa base). Toca un punto para abrir el sitio. Para ver sobre mapa satelital exporta KML/KMZ y ábrelo en AlpineQuest.</small></div>`}
function resT(){const S=P.sites.filter(s=>s.trees.some(t=>+t.d>0)),ns=S.length,all=S.flatMap(s=>s.trees.filter(t=>+t.d>0));if(!ns)return'<div class="card">Captura árboles con DAP para ver resultados.</div>';
const ha=ns*P.plot,ab=t=>Math.PI*t.d*t.d/40000,tot=all.reduce((a,t)=>a+ab(t),0),sp={};all.forEach(t=>{const k=t.sci||t.com||'Sin identificar';(sp[k]??={n:0,ab:0,s:new Set()});sp[k].n++;sp[k].ab+=ab(t)});S.forEach(s=>s.trees.forEach(t=>{const k=t.sci||t.com||'Sin identificar';sp[k]?.s.add(s.n)}));
const fr=Object.values(sp).reduce((a,x)=>a+x.s.size,0),rows=Object.entries(sp).map(([k,x])=>{const dr=x.n/all.length*100,dm=x.ab/tot*100,f=x.s.size/fr*100;return{k,n:x.n,dr,dm,f,ivi:dr+dm+f}}).sort((a,b)=>b.ivi-a.ivi),hm=all.reduce((a,t)=>a+(+t.h||0),0)/all.filter(t=>+t.h>0).length;
return`<div class="card"><h3>Resumen (${ns} sitios de ${P.plot} ha)</h3>Árboles: <b>${all.length}</b> · Densidad: <b>${(all.length/ha).toFixed(1)}</b> árb/ha<br>AB: <b>${(tot/ha).toFixed(2)}</b> m²/ha · Altura media: <b>${isFinite(hm)?hm.toFixed(1):'-'}</b> m</div>
<div class="card"><h3>IVI (Índice de Valor de Importancia)</h3><div class="sc"><table><tr><th>Especie</th><th>N</th><th>Dens. rel %</th><th>Dom. rel %</th><th>Frec. rel %</th><th>IVI (0-300)</th></tr>${rows.map(r=>`<tr><td><i>${esc(r.k)}</i></td><td>${r.n}</td><td>${r.dr.toFixed(1)}</td><td>${r.dm.toFixed(1)}</td><td>${r.f.toFixed(1)}</td><td><b>${r.ivi.toFixed(1)}</b></td></tr>`).join('')}</table></div></div><button class="s" onclick="csv()">Exportar árboles (CSV)</button>`}
function cfgT(){const o=P.mode,m=['','manual','puntos','sinnum','poli'].indexOf(o);
return`<div class="card"><h3>Coordenadas y parcela</h3><div class="row"><div>Zona UTM<input type="number" min="1" max="60" value="${P.zone||''}" placeholder="auto" onchange="P.zone=+this.value||null;save();R()"></div><div>Tamaño del sitio (ha)<input type="number" step="0.01" value="${P.plot}" onchange="P.plot=+this.value||0.1;save();R()"></div></div><small>Si el archivo no permite saber la zona, déjala vacía y se calcula del primer punto; puedes escribirla tú.</small></div>
${o=='manual'?'':`<div class="card"><h3>${o=='poli'?'Cargar polígono':'Cargar capa de puntos'}</h3><input type="file" accept=".kml,.kmz,.shp,.zip" onchange="ld(this.files[0])"><small>KML, KMZ, SHP (.shp o .zip con .prj/.dbf)</small>${o!='poli'&&P.sites.length?`<p><b>${P.sites.length} sitios detectados.</b> ${o=='sinnum'?'Asigna el número de cada uno:':'Puedes corregir números:'}</p><div class="sc">${P.sites.map((s,i)=>`<div class="row" style="flex-wrap:nowrap"><input type="number" style="flex:0 0 80px" value="${s.n}" onchange="P.sites[${i}].n=+this.value;save()"><small>${U(s)}</small></div>`).join('')}</div>`:''}</div>`}
${o=='poli'?polyC():''}
<div class="card"><h3>Columnas</h3>${P.cols.map((c,i)=>`<div class="row" style="flex-wrap:nowrap"><span>${esc(c.n)}${c.f?` <small>= ${esc(c.f)}</small>`:''}</span><span style="flex:0 0 auto"><button class="s" onclick="mv(${i},-1)">↑</button><button class="s" onclick="mv(${i},1)">↓</button>${i>3?`<button class="r" onclick="P.cols.splice(${i},1);save();R()">✕</button>`:''}</span></div>`).join('')}
<hr><div class="row"><input id="cn" placeholder="Nombre de columna"><select id="ct"><option value="text">Texto</option><option value="num">Número</option><option value="calc">Fórmula</option></select></div><input id="cf" placeholder="Fórmula con d (DAP cm), h (altura m), ab. Ej: d/h"><br><button onclick="addC()">+ Agregar columna</button><button class="s" onclick="tab='res';R()">Ver IVI</button></div>

function polyC(){const g=P.g||{};const A=P.poly.length?area()/1e4:0;return`<div class="card"><h3>Generar sitios en polígono</h3>${P.poly.length?`Área: <b>${A.toFixed(2)} ha</b>`:'<small>Carga primero el polígono.</small>'}
<h3 style="margin-top:12px">Error de muestreo</h3><div class="row"><div>CV % (piloto)<input id="gcv" type="number" value="${g.cv||40}"></div><div>Error admisible %<input id="ge" type="number" value="${g.e||10}"></div><div>t (Student)<input id="gt" type="number" step="0.01" value="${g.t||2}"></div></div><button class="s" onclick="calcN()">Calcular nº de sitios</button> <b id="gr"></b><small><br>n = N·t²·CV² / (N·E² + t²·CV²), N = área / tamaño del sitio</small>
<h3 style="margin-top:12px">Distribución</h3><div class="row"><div>Nº de sitios (vacío = automático)<input id="gn" type="number" value="${g.n||''}"></div><div>Separación (m)<input id="gs" type="number" value="${g.s||''}"></div><div>Método<select id="gm"><option value="s">Sistemático</option><option value="a" ${g.m=='a'?'selected':''}>Aleatorio</option></select></div></div><button onclick="genS()">Generar sitios</button></div>`}
function ll(){const la=P.poly.reduce((a,p)=>a+p[0],0)/P.poly.length,lo=P.poly.reduce((a,p)=>a+p[1],0)/P.poly.length;return{la,lo,kx:111320*Math.cos(la*Math.PI/180),ky:110574}}
const xyP=()=>{const c=ll();return P.poly.map(p=>[(p[1]-c.lo)*c.kx,(p[0]-c.la)*c.ky])};
function area(){const v=xyP();let a=0;v.forEach((p,i)=>{const q=v[(i+1)%v.length];a+=p[0]*q[1]-q[0]*p[1]});return Math.abs(a/2)}
const inP=(v,x,y)=>{let r=false;for(let i=0,j=v.length-1;i<v.length;j=i++)if((v[i][1]>y)!=(v[j][1]>y)&&x<(v[j][0]-v[i][0])*(y-v[i][1])/(v[j][1]-v[i][1])+v[i][0])r=!r;return r};
function gv(){P.g={cv:+$('#gcv').value,e:+$('#ge').value,t:+$('#gt').value,n:+$('#gn').value||0,s:+$('#gs').value||0,m:$('#gm').value};return P.g}
function calcN(){if(!P.poly.length)return toast('Carga el polígono');const g=gv(),N=area()/1e4/P.plot,n=Math.ceil(N*g.t**2*g.cv**2/(N*g.e**2+g.t**2*g.cv**2));$('#gr').textContent=`→ ${n} sitios`;P.g.n=n;$('#gn').value=n;save()}
function genS(){if(!P.poly.length)return toast('Carga el polígono');const g=gv(),v=xyP(),A=area(),c=ll(),xs=v.map(p=>p[0]),ys=v.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);let out=[];
if(g.m=='s'){const st=g.s||(g.n?Math.sqrt(A/g.n):0);if(!st)return toast('Indica nº de sitios o separación');for(let x=x0+st/2;x<x1;x+=st)for(let y=y0+st/2;y<y1;y+=st)if(inP(v,x,y))out.push([x,y]);if(g.n&&out.length>g.n)out=Array.from({length:g.n},(_,i)=>out[Math.floor(i*out.length/g.n)])}
else{if(!g.n)return toast('Indica el nº de sitios');let k=0;while(out.length<g.n&&k++<30000){const x=x0+Math.random()*(x1-x0),y=y0+Math.random()*(y1-y0);if(inP(v,x,y)&&out.every(p=>Math.hypot(p[0]-x,p[1]-y)>=(g.s||0)))out.push([x,y])}}
if(P.sites.some(s=>s.trees.length)&&!confirm('Se reemplazarán los sitios actuales. ¿Continuar?'))return;
P.sites=out.map((p,i)=>({n:i+1,lat:c.la+p[1]/c.ky,lon:c.lo+p[0]/c.kx,trees:[],photos:[]}));si=0;save();toast(P.sites.length+' sitios generados');R()}
async function ld(f){if(!f)return;try{const x=f.name.toLowerCase().split('.').pop(),pt=[];let poly=[];
const add=(g,pr)=>{if(!g)return;if(g.type=='Point')pt.push({name:Object.entries(pr||{}).find(([k])=>/^(sitio|site|name|nombre|id|num|fid)/i.test(k))?.[1],lat:g.coordinates[1],lon:g.coordinates[0]});else if(/Polygon/.test(g.type)&&!poly.length){const r=g.type=='Polygon'?g.coordinates[0]:g.coordinates[0][0];poly=r.map(p=>[p[1],p[0]])}else if(g.type=='MultiPoint')g.coordinates.forEach(c=>add({type:'Point',coordinates:c},pr))};
if(x=='shp'){shp.parseShp(await f.arrayBuffer()).forEach(g=>add(g,{}))}else if(x=='zip'){let j=await shp(await f.arrayBuffer());(Array.isArray(j)?j:[j]).forEach(c=>c.features.forEach(ft=>add(ft.geometry,ft.properties)))}
else{let t;if(x=='kmz'){const z=await JSZip.loadAsync(f),k=Object.keys(z.files).find(n=>/\.kml$/i.test(n));t=await z.files[k].async('string')}else t=await f.text();
const d=new DOMParser().parseFromString(t,'text/xml');[...d.getElementsByTagName('Placemark')].forEach(pm=>{const nm=pm.getElementsByTagName('name')[0]?.textContent,cs=pm.getElementsByTagName('coordinates')[0]?.textContent.trim().split(/\s+/).map(s=>s.split(',').map(Number));if(!cs)return;if(pm.getElementsByTagName('Polygon')[0]){if(!poly.length)poly=cs.map(c=>[c[1],c[0]])}else if(pm.getElementsByTagName('Point')[0])pt.push({name:nm,lat:cs[0][1],lon:cs[0][0]})})}
if(P.mode=='poli'){if(!poly.length)return toast('No encontré un polígono en el archivo');P.poly=poly;P.sites=[]}
else{if(!pt.length)return toast('No encontré puntos en el archivo');P.sites=pt.map((p,i)=>{const m=P.mode=='puntos'&&String(p.name??'').match(/\d+/);return{n:m?+m[0]:i+1,lat:p.lat,lon:p.lon,trees:[],photos:[]}});if(P.mode=='puntos'&&!pt.some(p=>/\d/.test(String(p.name??''))))toast('No hallé números de sitio: se numeraron por orden, puedes cambiarlos')}
const a=P.poly.length&&P.mode=='poli'?P.poly[0]:[P.sites[0]?.lat,P.sites[0]?.lon];if(!P.zone&&a[0]!=null)P.zone=utm(a[0],a[1]).z;si=0;save();toast(P.mode=='poli'?'Polígono cargado':P.sites.length+' sitios cargados');R()}catch(e){toast('No pude leer el archivo')}}
function mv(i,d){const j=i+d;if(j<0||j>=P.cols.length)return;[P.cols[i],P.cols[j]]=[P.cols[j],P.cols[i]];save();R()}

async function dl(name,blob){if(DL){try{await DL.save({filename:name,data:blob});return}catch(e){if(e.code=='declined')return;toast(e.message||'No se pudo guardar')}}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}}
function kml(z){const ss=P.sites.filter(s=>s.lat!=null);let k=0;return`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${esc(P.name)}</name>`+(P.poly.length?`<Placemark><name>Poligono</name><Polygon><outerBoundaryIs><LinearRing><coordinates>${P.poly.concat([P.poly[0]]).map(p=>p[1]+','+p[0]+',0').join(' ')}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`:'')+ss.map(s=>`<Placemark><name>Sitio ${s.n}</name><description>${esc(U(s))} | ${s.trees.length} árboles</description><Point><coordinates>${s.lon},${s.lat},0</coordinates></Point></Placemark>`).join('')+ss.flatMap(s=>s.photos.filter(p=>p.lat!=null).map(p=>{k++;return`<Placemark><name>Foto sitio ${s.n}</name>${z?`<description><![CDATA[<img src="files/f${k}.jpg" width="300"/>]]></description>`:''}<Point><coordinates>${p.lon},${p.lat},0</coordinates></Point></Placemark>`})).join('')+'</Document></kml>'}
